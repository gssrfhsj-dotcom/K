<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>EYRA - Sign Language Avatar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e293b'/><path d='M8 50 Q50 12 92 50 Q50 88 8 50Z' fill='white'/><circle cx='50' cy='50' r='19' fill='%234fd1c5'/><circle cx='50' cy='50' r='9' fill='%23111'/><circle cx='56' cy='44' r='4' fill='white'/></svg>">
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
    canvas { background: #222; border-radius: 12px; margin-top: 12px; }

    input { width: 70%; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>EYRA</h2>
  <input id="text" placeholder="Type a sentence">
  <button id="play">Play</button>
  <canvas id="stage" width="500" height="500"></canvas>

  <script src="m.js"></script>
  <script>
    let dictionary = {};
    fetch("signs.json").then(r => r.json()).then(d => dictionary = d);

    document.getElementById("play").onclick = () => {
      const words = document.getElementById("text").value
        .trim().toLowerCase().split(/\s+/);
      const signs = words.map(w => dictionary[w]).filter(Boolean);
      Avatar.playSequence(signs);
    };
  </script>
</body>
</html>
