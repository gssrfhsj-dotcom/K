<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>EYRA - Sign Language Avatar</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
    canvas { background: #222; border-radius: 12px; margin-top: 12px; }
    input { width: 70%; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>EYRA</h2>
  <input id="text" placeholder="Type a sentence">
  <button id="play">Play</button>
  <button id="speak">🎤 Speak</button>
  <canvas id="stage" width="500" height="500"></canvas>

  <script src="m.js"></script>
  <script>
    let dictionary = {};
    fetch("signs.json").then(r => r.json()).then(d => dictionary = d);

    // Play the signs for the text in the input box
    document.getElementById("play").onclick = () => {
      const words = document.getElementById("text").value
        .toLowerCase()
        .replace(/[^\p{L}\s]/gu, "") // remove punctuation
        .trim()
        .split(/\s+/)
        .filter(Boolean);

      const missing = words.filter(w => !dictionary[w]);
      if (missing.length) console.warn("Words not in dictionary:", missing);

      const signs = words.map(w => dictionary[w]).filter(Boolean);
      Avatar.playSequence(signs);
    };

    // Speech recognition (Chrome / Edge)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SR) {
      document.getElementById("speak").disabled = true;
      alert("This browser does not support speech recognition. Try Chrome.");
    } else {
      const rec = new SR();
      rec.lang = "en-US";
      rec.interimResults = false;

      rec.onresult = e => {
        const text = e.results[0][0].transcript;
        document.getElementById("text").value = text;
        document.getElementById("play").click(); // play the avatar right away
      };

      rec.onerror = e => console.warn("Speech error:", e.error);

      document.getElementById("speak").onclick = () => rec.start();
    }
  </script>
</body>
</html>
